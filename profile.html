<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile | Bricklane</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page profile-page">
  <header class="app-header">
    <a class="brand" href="customer.html"><span class="brand-mark">B</span><span>bricklane</span></a>
    <nav><a class="nav-link" id="dashboard-link" href="customer.html">Dashboard</a><a class="nav-link active" href="profile.html">Profile</a></nav>
    <div class="header-account"><a class="account-profile-link" href="profile.html" aria-label="View your profile"><span class="avatar" id="profile-avatar">B</span><span class="account-name" id="profile-account-name">Your profile</span></a><button class="icon-button" id="logout" title="Log out">↗</button></div>
  </header>
  <main class="dashboard shell">
    <section class="profile-heading"><div><p class="eyebrow" id="profile-eyebrow">Account</p><h1 id="profile-title">Your profile</h1><p class="muted" id="profile-subtitle">Your property ownership, in one considered view.</p></div><div class="profile-mark" id="profile-mark">B</div></section>
    <section class="metric-grid" id="profile-metrics"></section>
    <section class="content-section"><div class="section-heading"><div><p class="eyebrow" id="holdings-eyebrow">Owned fractions</p><h2 id="holdings-title">Properties I own</h2></div><span class="mono" id="holding-count"></span></div><div class="profile-property-grid" id="profile-properties"></div></section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="js/api.js"></script><script src="js/profile.js"></script>
</body>
</html>
