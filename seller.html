<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Seller dashboard | Bricklane</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body class="app-page"><header class="app-header"><a class="brand" href="seller.html"><span class="brand-mark">B</span><span>bricklane</span></a><nav><a class="nav-link active" href="#listings">My listings</a><a class="nav-link" href="#insights">Insights</a><a class="nav-link" href="profile.html">Profile</a></nav><div class="header-account"><a class="account-profile-link" href="profile.html" aria-label="View your profile"><span class="avatar avatar-green">AK</span><span class="account-name">Alex Kim</span></a><button class="icon-button" id="logout" title="Log out">↗</button></div></header>
  <main class="dashboard shell"><section class="dashboard-intro seller-intro"><div><p class="eyebrow">Property desk</p><h1>Places with a future.</h1><p class="muted">Keep an eye on your listings, interest, and available shares.</p></div><button class="button button-primary" id="open-listing">+ Add a property</button></section><section class="metric-grid" id="seller-metrics"></section><section class="content-section" id="listings"><div class="section-heading"><div><p class="eyebrow">Your properties</p><h2>Active listings</h2></div><span class="mono" id="listing-count">0 listings</span></div><div class="property-grid" id="seller-grid"></div></section></main>
  <div class="modal-backdrop" id="listing-modal"><div class="modal modal-wide"><button class="modal-close" data-close-modal aria-label="Close">×</button><p class="eyebrow">New asset</p><h2>Tokenize a property</h2><p class="muted">Add the details investors need to make a confident decision.</p><form id="listing-form" class="listing-form"><label>Property title<input name="title" type="text" placeholder="e.g. The Juniper House" required></label><label>Property type<select name="category"><option value="residential">Residential</option><option value="commercial">Commercial</option></select></label><label class="full-field">Description<textarea name="description" rows="3" placeholder="Tell investors what makes this place special..." required></textarea></label><label class="full-field">Upload a photo (JPG, PNG, or WebP; up to 5 MB)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="full-field">Or use an image URL<input name="imageUrl" type="url" placeholder="https://images.unsplash.com/..."></label><label>Total valuation<input name="totalValuation" type="number" min="1" placeholder="1000000" required></label><label>Tokens to issue<input name="totalTokens" type="number" min="1" placeholder="10000" required></label><button class="button button-primary button-full full-field" type="submit">Publish tokenized property <span>↗</span></button></form></div></div><div class="toast" id="toast" role="status"></div><script src="js/api.js"></script><script src="js/seller.js"></script></body></html>
